<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="PaperToTalk — 从论文到讲述的科研英语工作流">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e18"/>
      <stop offset="0.55" stop-color="#0e1b2e"/>
      <stop offset="1" stop-color="#0b2a31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- paper stack -->
  <g transform="translate(916 122)">
    <rect x="22" y="22" width="196" height="238" rx="14" fill="#ffffff" opacity="0.07"/>
    <rect x="11" y="11" width="196" height="238" rx="14" fill="#ffffff" opacity="0.11"/>
    <rect x="0" y="0" width="196" height="238" rx="14" fill="url(#paper)"/>
    <rect x="28" y="34" width="96" height="11" rx="5.5" fill="#0f172a" opacity="0.78"/>
    <rect x="28" y="60" width="140" height="7" rx="3.5" fill="#334155" opacity="0.45"/>
    <rect x="28" y="79" width="124" height="7" rx="3.5" fill="#334155" opacity="0.45"/>
    <rect x="28" y="98" width="134" height="7" rx="3.5" fill="#334155" opacity="0.45"/>
    <rect x="28" y="128" width="78" height="7" rx="3.5" fill="#334155" opacity="0.30"/>
    <rect x="28" y="147" width="130" height="7" rx="3.5" fill="#334155" opacity="0.30"/>
    <rect x="28" y="166" width="110" height="7" rx="3.5" fill="#334155" opacity="0.30"/>
    <rect x="28" y="196" width="46" height="11" rx="5.5" fill="#14b8a6" opacity="0.9"/>
  </g>

  <!-- waveform -->
  <g transform="translate(916 404)" fill="url(#accent)">
    <rect x="0"   y="40" width="9" height="30" rx="4.5" opacity="0.55"/>
    <rect x="19"  y="24" width="9" height="62" rx="4.5" opacity="0.70"/>
    <rect x="38"  y="6"  width="9" height="98" rx="4.5" opacity="0.90"/>
    <rect x="57"  y="30" width="9" height="50" rx="4.5" opacity="0.70"/>
    <rect x="76"  y="16" width="9" height="78" rx="4.5" opacity="0.85"/>
    <rect x="95"  y="36" width="9" height="38" rx="4.5" opacity="0.60"/>
    <rect x="114" y="10" width="9" height="90" rx="4.5" opacity="0.90"/>
    <rect x="133" y="28" width="9" height="54" rx="4.5" opacity="0.70"/>
    <rect x="152" y="42" width="9" height="26" rx="4.5" opacity="0.55"/>
    <rect x="171" y="18" width="9" height="74" rx="4.5" opacity="0.80"/>
    <rect x="190" y="34" width="9" height="42" rx="4.5" opacity="0.65"/>
  </g>

  <!-- text -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <rect x="80" y="86" width="190" height="34" rx="17" fill="#5eead4" opacity="0.12"/>
    <text x="102" y="109" font-size="15" font-weight="600" fill="#5eead4" letter-spacing="2.4">PAPER → TALK</text>

    <text x="80" y="214" font-size="98" font-weight="700" fill="#f8fafc" letter-spacing="-2.5">PaperToTalk</text>
    <text x="84" y="270" font-size="27" fill="#a9bdd1">Read → Write → Speak, with evidence you can compare.</text>
    <text x="84" y="310" font-size="21" fill="#6f87a0">从论文到讲述的科研英语工作流</text>

    <g font-size="18" fill="#c9d8e6">
      <rect x="80" y="360" width="470" height="46" rx="12" fill="#ffffff" opacity="0.055"/>
      <text x="102" y="389">Zotero / Yomitan  →  Anki  →  daily review</text>

      <rect x="80" y="418" width="470" height="46" rx="12" fill="#ffffff" opacity="0.055"/>
      <text x="102" y="447">Phrasebank + LTeX+ + Vale  →  paper sections</text>

      <rect x="80" y="476" width="470" height="46" rx="12" fill="#ffffff" opacity="0.055"/>
      <text x="102" y="505">Kokoro / Whisper / Praat  →  talks that land</text>
    </g>

    <text x="84" y="582" font-size="16" fill="#5f7891">Local-first  ·  Windows / macOS / Linux  ·  MIT code + CC BY-NC 4.0 docs</text>
    <rect x="84" y="596" width="108" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
