<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Prism — 把一篇论文拆成读、写、说">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e12"/>
      <stop offset="0.6" stop-color="#12151b"/>
      <stop offset="1" stop-color="#181c24"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".28" r=".7">
      <stop offset="0" stop-color="#e8a091" stop-opacity=".20"/>
      <stop offset="1" stop-color="#e8a091" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a091"/>
      <stop offset=".38" stop-color="#d9b26f"/>
      <stop offset=".7" stop-color="#83b7a8"/>
      <stop offset="1" stop-color="#a79bd8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- paper -> prism -> spectrum -->
  <g transform="translate(788 128)">
    <g>
      <rect x="6" y="70" width="118" height="150" rx="10" fill="#efe9df"/>
      <rect x="24" y="94" width="62" height="9" rx="4.5" fill="#22262d" opacity=".8"/>
      <rect x="24" y="116" width="84" height="5" rx="2.5" fill="#5c6270" opacity=".55"/>
      <rect x="24" y="130" width="72" height="5" rx="2.5" fill="#5c6270" opacity=".55"/>
      <rect x="24" y="144" width="80" height="5" rx="2.5" fill="#5c6270" opacity=".55"/>
      <rect x="24" y="166" width="34" height="9" rx="4.5" fill="#c97668"/>
    </g>
    <path d="M132 145H268" stroke="#f4efe6" stroke-opacity=".7" stroke-width="3"/>
    <path d="M352 145 L438 74" stroke="#e8a091" stroke-width="2.8" fill="none"/>
    <path d="M352 145 L442 118" stroke="#d9b26f" stroke-width="2.8" fill="none"/>
    <path d="M352 145 L442 166" stroke="#83b7a8" stroke-width="2.8" fill="none"/>
    <path d="M352 145 L434 212" stroke="#a79bd8" stroke-width="2.8" fill="none"/>
    <path d="M310 8 L388 240 H232 Z" fill="#161a22" stroke="#f2ede4" stroke-width="3.4" stroke-linejoin="round"/>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <rect x="84" y="80" width="252" height="34" rx="17" fill="#e8a091" opacity=".14"/>
    <text x="106" y="103" font-size="14" font-weight="600" fill="#e8a091" letter-spacing="3">READ · WRITE · SPEAK</text>

    <text x="84" y="212" font-family="Iowan Old Style, Palatino Linotype, Georgia, serif" font-size="104" fill="#f2ede4" letter-spacing="-1">Prism</text>
    <text x="88" y="262" font-size="26" fill="#c6ccd6">论文读完了，却讲不出来？</text>
    <text x="88" y="300" font-size="19" fill="#8e939f">把同一篇论文拆成读、写、说三种练习，并留下可以比较的记录。</text>

    <g font-size="17" fill="#d6d0c5">
      <rect x="84" y="346" width="560" height="48" rx="12" fill="#ffffff" opacity=".05"/>
      <circle cx="108" cy="370" r="4" fill="#e8a091"/>
      <text x="128" y="377">Zotero 里挑一篇 → 3 分钟讲述稿 + Kokoro 示范音</text>

      <rect x="84" y="406" width="560" height="48" rx="12" fill="#ffffff" opacity=".05"/>
      <circle cx="108" cy="430" r="4" fill="#d9b26f"/>
      <text x="128" y="437">录一版 → Whisper 对齐 + Praat 音高 → WER 与差异</text>

      <rect x="84" y="466" width="560" height="48" rx="12" fill="#ffffff" opacity=".05"/>
      <circle cx="108" cy="490" r="4" fill="#83b7a8"/>
      <text x="128" y="497">Phrasebank 改段落 · 标注一键进 Anki 复习</text>
    </g>

    <text x="88" y="576" font-size="15" fill="#6b7280">本地优先 · Windows 一键启动 · MIT code + CC BY-NC 4.0 docs · lumenhao.github.io/Prism</text>
    <rect x="88" y="592" width="132" height="4" rx="2" fill="url(#spectrum)"/>
  </g>
</svg>
