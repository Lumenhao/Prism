name: Feature request
description: 提议一个新流程、规则或工具集成
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的真实任务
      description: 描述具体场景，而不是“希望更智能”
      placeholder: 例：组会里被追问时总是重复问题，想练“确认—改写—回答”的短句
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么做
      description: 尽量落到文件、命令、数据结构或训练步骤
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 为什么现有流程不够用

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 词汇线
        - 写作线
        - 口语线
        - 仓库工程（CI / 测试 / 文档）
        - 跨模块
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案保持本地优先，不强制上传个人数据
          required: true
        - label: 不引入需要付费 API 才能跑通的核心路径
          required: true
